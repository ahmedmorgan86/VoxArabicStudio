    <script>
      // Ignore disabled Vite HMR websocket reconnection noise
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (String(e.reason.message).includes('WebSocket') || String(e.reason).includes('WebSocket'))) {
          e.preventDefault();
        }
      });
    </script>
